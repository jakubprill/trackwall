packages:
  - packages/*
  - apps/*

onlyBuiltDependencies:
  - esbuild

# The daemon takes the tree-sitter grammars (ADR-37) as WASM files; we do not build their native addons.
ignoredBuiltDependencies:
  - "@tree-sitter-grammars/tree-sitter-kotlin"
  - tree-sitter-java

overrides:
  # The Kotlin grammar package has its author tool in `dependencies` instead of `devDependencies`.
  "@tree-sitter-grammars/tree-sitter-kotlin>npm-check-updates": "-"
  # VitePress 1.6 asks for Vite 5, whose dev server has known vulnerabilities fixed only in 6.4.4+ (ADR-56).
  "vitepress>vite": "6.4.5"
  # VitePress 1.6 bundles markdown-it types from before 14.2; with 14.2 its markdown hook rejects markdown-it plugins.
  # Pinned for the whole workspace, so that VitePress and vitepress-plugin-llms see the same types.
  "@types/markdown-it": "14.1.2"
  # Mermaid 11 (from @streamdown/mermaid, the README view) asks for KaTeX 0.16, which has GHSA-238p-pmpm-9mq7, fixed
  # in 0.18.2. Mermaid 12 moved to KaTeX 0.18 with the same API; remove this when @streamdown/mermaid takes Mermaid 12.
  "mermaid>katex": "0.18.11"

packageExtensions:
  # vitepress-plugin-llms types its Vite plugin against `vite` without declaring it, so it got whichever Vite pnpm
  # hoisted (the desktop app's Vite 8 in CI); it runs inside VitePress, so it gets VitePress's Vite.
  vitepress-plugin-llms:
    dependencies:
      vite: "6.4.5"

patchedDependencies:
  # koota (Pawn's ECS) builds its trait accessors with `new Function`, which the Tauri window's CSP refuses, and the Home
  # scene threw before it drew. The patch makes them closures that do the same. Remove it when koota stops generating code;
  # the E2E test of the window under its CSP shows whether it does.
  koota@0.6.6: patches/koota@0.6.6.patch
