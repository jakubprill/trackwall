# Aktualizacje zależności raz w tygodniu, jeden PR na ekosystem, żeby nie zasypać kolejki.
# Akcje GitHub są przypięte do SHA; Dependabot podbija SHA razem z komentarzem wersji.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
