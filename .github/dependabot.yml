# Dependency updates once a week, grouped per ecosystem, so that they do not flood the queue.
# GitHub actions are pinned to a SHA; Dependabot bumps the SHA together with the version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  # The Spring Boot projects of the tests with real Java builds (ADR-72): a new Spring Boot or plugin version comes in
  # a PR, on which jvm.yml runs, so the tests follow what users build with. The Maven and Gradle versions are in their
  # mise.toml, which Dependabot does not read.
  - package-ecosystem: maven
    directory: /packages/daemon/jvm/projects/orders
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /packages/daemon/jvm/projects/checkout
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
