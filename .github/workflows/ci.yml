name: CI

# The repo is public, so standard runners cost nothing, but every run is a wait (ADR-22, ADR-109). Every PR runs:
# - lint, rustfmt, typecheck, tests and the documentation site build on Linux, plus the dependency audit;
# - tests on Windows;
# - the contract tests with the real Copilot CLI on Linux and Windows (ADR-67);
# - the E2E tests of the UI in Chromium on Linux and Windows (ADR-71);
# - the daemon build and the Tauri portable build on Windows (clippy, cargo test, sidecar smoke test);
# - the aggregate `CI ok` job, the only check to require in main branch protection.
# macOS joins every one of these jobs every night (nightly.yml calls this workflow with `macos`), in a manual run with
# `macos` ticked, and at release (release.yml tests and builds on it).
# A push to main runs only the Linux job, the audit and the Windows build: `CI ok` is strict in main's protection, so the
# merged tree is the one the PR already tested, and the build is what keeps main's Rust cache warm for PRs.
# Jobs run in parallel: a run takes as long as the longest job (Windows), not the sum.
# No paths-ignore: the required check must report on every PR, and tests check docs/release-notes.
# release.yml builds releases independently of this file.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Also run tests, contract tests, E2E tests and the build on macOS
        type: boolean
        default: false
  workflow_call:
    inputs:
      macos:
        description: Also run tests, contract tests, E2E tests and the build on macOS
        type: boolean
        default: false

# A new push to a PR branch cancels its previous run, because the next one covers the same changes. On main
# every commit has its own group, so pushing the next commit does not cancel it (only a manual run of the same commit does): a shared group keeps only one pending
# run and drops it when another arrives, and then nobody knows which commit broke main. The event is in the group, so the
# nightly run of a commit does not cancel its push run, or the other way round.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

# No permissions by default; every job gets only what it needs.
permissions: {}

# The same versions as in mise.toml; apps/desktop/test/toolchain.test.ts guards this.
env:
  BUN_VERSION: "1.4.4"
  NODE_VERSION: "22"
  RUST_VERSION: "1.90"

# Actions pinned to a SHA (the comment is the version): a moved action tag cannot swap the code that runs here.
# Dependabot updates them (.github/dependabot.yml). .github/actions/setup installs Node, pnpm and Bun
# (except in the audit, which needs only pnpm and Node).
jobs:
  check:
    name: lint, typecheck, test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
      # rustfmt does not need the Tauri system libraries, so Rust formatting gets its verdict in the fast Linux job.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; RUST_VERSION sets the Rust version
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: cargo fmt (Tauri shell)
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # A broken page or link between pages fails the build (links to GitHub are not checked); pages.yml publishes the same build from main (ADR-56).
      - name: Documentation site
        run: pnpm --filter @trackwall/docs build

  # A vulnerability without a fixed version would block every PR, so it goes into auditConfig
  # in pnpm-workspace.yaml (pnpm audit --ignore) with a comment on why, and the audit stays in `CI ok`.
  audit:
    name: known dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # No pnpm install and no Bun: pnpm audit reads only the lockfile.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # setup-node v5 enables the pnpm cache from packageManager by itself; without install the store does not exist and saving the cache fails the job.
          package-manager-cache: false
      - run: pnpm audit --audit-level high

  # Not on a push to main, which only repeats what the PR tested (see the top of this file).
  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["windows-latest", "macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm test

  # The real Copilot CLI of the pinned version (ADR-67); nightly.yml runs the same on the newest one on all three systems.
  contract:
    if: github.event_name != 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/contract.yml
    with:
      systems: ${{ inputs.macos && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest", "windows-latest"]' }}

  # Four paths through the built UI in Chromium from Playwright, on the daemon with the fake Copilot CLI (ADR-71). Also on
  # Windows, because the fake's screen reaches the browser through the PTY, which is ConPTY there.
  e2e:
    name: e2e (${{ matrix.os }})
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
      # Only the headless shell, which a headless launch uses; on Linux also the system libraries it needs.
      - name: Chromium for Playwright
        run: pnpm --filter @trackwall/daemon exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} --only-shell chromium
      - run: pnpm test:e2e

  # The build is the longest step of a run, so it has its own job next to `test`, not after it.
  desktop:
    name: build, portable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["windows-latest", "macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; RUST_VERSION sets the Rust version
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
          # The same key as in release.yml (without it the key contains the job name), so that a release hits the cache from main.
          shared-key: desktop
          # Only main saves the cache (on a push for Windows, at night for macOS); PR runs read it instead of keeping their
          # own copies within the 10 GB limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm build:desktop
      # After the build, because tauri-build needs the sidecar binary that build:desktop creates.
      - name: cargo clippy (Tauri shell)
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: cargo test (Tauri shell)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: smoke test of the built sidecar
        run: bun packages/daemon/scripts/smoke.ts apps/desktop/src-tauri/target/release/trackwall-daemon
      - run: pnpm portable
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: trackwall-${{ runner.os }}
          path: out/*.zip
          if-no-files-found: error

  # The check to require in main protection (the repo owner sets it up): matrix job names may change, this one does not.
  # `always()`, because GitHub counts a skipped required check as passed; here a skipped or
  # cancelled dependency gives a red result, except the jobs a push to main skips on purpose.
  ci-ok:
    name: CI ok
    needs: [check, audit, test, contract, e2e, desktop]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs green
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          passed='.value.result == "success" or ($event == "push" and .value.result == "skipped" and (.key | IN("test", "contract", "e2e")))'
          jq -e --arg event "$EVENT" "all(to_entries[]; $passed)" <<< "$RESULTS" > /dev/null && exit 0
          jq -r --arg event "$EVENT" "to_entries[] | select(($passed) | not) | \"::error::\\(.key): \\(.value.result)\"" <<< "$RESULTS"
          exit 1
