name: CI

# Minuta runnera Windows liczy się w limicie GitHub Actions podwójnie, a macOS dziesięciokrotnie (ADR-15), więc:
# - każdy PR: lint, rustfmt, typecheck i testy na Linuksie plus audyt zależności;
# - push na main i ręczne uruchomienie (także na gałęzi PR): do tego testy, portable build i spike'i
#   na Windowsie i macOS.
# Same zmiany w Markdownie i docs/ nie uruchamiają CI. Wydania buduje release.yml niezależnie od tego pliku.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

# Nowy push przerywa poprzedni przebieg tej samej gałęzi, także na main: następny przebieg obejmuje
# te same zmiany, a minuty Windowsa i macOS są tu najdroższe. Commit wydania i tak przechodzi testy
# na obu systemach w release.yml.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Domyślnie żadnych uprawnień; każdy job dostaje tylko to, czego potrzebuje.
permissions: {}

# Te same wersje co w mise.toml; pilnuje tego apps/desktop/test/toolchain.test.ts.
env:
  BUN_VERSION: "1.4.2"
  NODE_VERSION: "22"
  RUST_VERSION: "1.90"

# Akcje przypięte do SHA (komentarz to wersja): przesunięty tag akcji nie podmieni kodu, który tu działa.
# Aktualizuje je Dependabot (.github/dependabot.yml). Node, pnpm i Bun instaluje .github/actions/setup
# (poza audytem, który potrzebuje tylko pnpm i Node).
jobs:
  check:
    name: lint, typecheck, test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
      # Jedyny krok Rust przy PR: rustfmt nie potrzebuje bibliotek systemowych Tauri, więc działa na Linuksie.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # gałąź stable; wersję Rust daje RUST_VERSION
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: cargo fmt (powłoka Tauri)
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  audit:
    name: znane podatności zależności
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Bez pnpm install i Bun: pnpm audit czyta tylko lockfile.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # setup-node v5 sam włącza cache pnpm z packageManager; bez install store nie istnieje i zapis cache kończy job błędem.
          package-manager-cache: false
      - run: pnpm audit --audit-level high

  # Jeden job na system: każdy job macOS kosztuje co najmniej 10 minut limitu, więc testy, build
  # i spike'i dzielą jeden. Lint i typecheck nie zależą od systemu, więc zostają w `check`.
  desktop:
    name: test, portable, spike'i (${{ matrix.os }})
    # Najpierw tani Linux: błąd lintu albo testu nie zużywa minut Windowsa i macOS.
    needs: check
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm test
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # gałąź stable; wersję Rust daje RUST_VERSION
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
          # Ten sam klucz co w release.yml (bez niego klucz zawiera nazwę joba), żeby wydanie trafiało w cache z main.
          shared-key: desktop
          # Cache zapisuje tylko main; ręczne przebiegi na gałęziach go czytają, zamiast trzymać własne kopie.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm build:desktop
      # Po buildzie, bo tauri-build wymaga binarki sidecara, którą tworzy build:desktop.
      - name: cargo clippy (powłoka Tauri)
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: cargo test (powłoka Tauri)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: smoke test sidecara z buildu
        run: bun packages/daemon/scripts/smoke.ts apps/desktop/src-tauri/target/release/trackwall-daemon
      - run: pnpm portable
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: trackwall-${{ runner.os }}
          path: out/*.zip
          if-no-files-found: error
      # Wynikiem spike'a jest tabela w podsumowaniu joba; czerwony spike nie blokuje przebiegu.
      # Spike'i nie zależą od buildu, więc idą także po jego błędzie, ale nie bez zależności.
      - name: "spike: Job Objects / grupy procesów"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        continue-on-error: true
        run: pnpm --filter @trackwall/spike-job-objects spike
      - name: "spike: PTY (ConPTY na Windowsie)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        continue-on-error: true
        run: pnpm --filter @trackwall/spike-conpty spike
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        with:
          name: spikes-${{ runner.os }}
          path: spikes/*/results/*.json
