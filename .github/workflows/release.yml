# Release from a vX.Y.Z tag: portable build on Windows and macOS, then one GitHub Release.
# The release is created only once both builds pass, so it is never half-done.
# The build steps are the same as in the `desktop` job in ci.yml. Instructions: docs/release.md
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

# The same versions as in mise.toml; apps/desktop/test/toolchain.test.ts guards this.
env:
  BUN_VERSION: "1.4.4"
  NODE_VERSION: "22"
  RUST_VERSION: "1.90"

# Actions pinned to a SHA: this workflow publishes binaries, so a moved action tag
# must not be able to swap what reaches users.
jobs:
  build:
    name: portable (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag on main and matching the app version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points to a commit outside main"
            exit 1
          fi
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in tauri.conf.json"
            exit 1
          fi

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; RUST_VERSION sets the Rust version
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
          # The same key as the `desktop` job in ci.yml: a release reads the cache from main but does not save it.
          shared-key: desktop
          save-if: false
      # A tag does not require green CI on its commit, so the release runs the tests on both systems itself.
      - run: pnpm test
      - run: pnpm build:desktop
      - name: smoke test of the built sidecar
        run: bun packages/daemon/scripts/smoke.ts apps/desktop/src-tauri/target/release/trackwall-daemon
      - run: pnpm portable
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: trackwall-${{ runner.os }}
          path: out/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only the release note; the versions.test.ts test makes sure it exists for the tagged version.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: docs/release-notes
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: trackwall-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          version="${TAG#v}"
          for f in "trackwall-$version-windows-x64.zip" "trackwall-$version-macos-arm64.zip"; do
            [ -f "$f" ] || { echo "::error::Missing $f, found: $(ls)"; exit 1; }
          done
          zips=(trackwall-*.zip)
          if [ ${#zips[@]} -ne 2 ]; then
            echo "::error::Expected 2 archives, found: ${zips[*]}"
            exit 1
          fi
          sha256sum "${zips[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Rerun after a failure: replace the files, do not create a second release.
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=()
            if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
            # The note from the repo goes before the list of PRs that GitHub generates.
            gh release create "$TAG" dist/* --verify-tag --generate-notes \
              --notes-file "docs/release-notes/$TAG.md" --title "Trackwall ${TAG#v}" "${prerelease[@]}"
          fi
