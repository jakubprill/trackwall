# Release from a vX.Y.Z tag: portable build on Windows and macOS and the Linux archives for a container (ADR-163), then
# one GitHub Release. The release is created only once every build passes, so it is never half-done.
# The update packages are signed and listed in `latest.json`, which the app's updater reads (ADR-53).
# The build steps are the same as in the `desktop` job in ci.yml. Instructions: docs/release.md
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

# The same versions as in mise.toml; apps/desktop/test/toolchain.test.ts guards this.
env:
  BUN_VERSION: "1.4.4"
  NODE_VERSION: "22"
  RUST_VERSION: "1.90"

# Actions pinned to a SHA: this workflow publishes binaries, so a moved action tag
# must not be able to swap what reaches users.
jobs:
  build:
    name: portable (${{ matrix.os }})
    # The update signing key is a secret of this environment only, which takes only `v*` tags: a workflow pushed
    # on any other ref never gets it (§8).
    environment: release
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag on main and matching the app version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points to a commit outside main"
            exit 1
          fi
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in tauri.conf.json"
            exit 1
          fi

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; RUST_VERSION sets the Rust version
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
          # The same key as the `desktop` job in ci.yml: a release reads the cache from main but does not save it.
          shared-key: desktop
          save-if: false
      # A tag does not require green CI on its commit, so the release runs the tests on both systems itself.
      - run: pnpm test
      - run: pnpm build:desktop
      - name: smoke test of the built sidecar
        run: bun packages/daemon/scripts/smoke.ts apps/desktop/src-tauri/target/release/trackwall-daemon
      - run: pnpm portable
      # The app installs only a package signed with the key whose public half is in tauri.conf.json, and
      # `--app-version` binds the signature to this version (`requireSignedVersion`). Only this step gets the key.
      - name: Sign the update package
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set, see docs/release.md"
            exit 1
          fi
          shopt -s nullglob
          # On Windows the release zip is the update package, on macOS the .app.tar.gz next to the zip.
          packages=(out/*-windows-x64.zip out/*.app.tar.gz)
          if [ ${#packages[@]} -ne 1 ]; then
            echo "::error::Expected one update package, found: ${packages[*]}"
            exit 1
          fi
          pnpm --filter @trackwall/desktop exec tauri signer sign --app-version "${TAG#v}" "$GITHUB_WORKSPACE/${packages[0]}"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: trackwall-${{ runner.os }}
          path: |
            out/*.zip
            out/*.tar.gz
            out/*.sig
          if-no-files-found: error
          retention-days: 7

  # The daemon and its page for a Linux container (ADR-163), built and smoke-tested on each architecture's own runner, and
  # signed with the update key, so that an update inside the container can check it.
  linux:
    name: Linux archive (${{ matrix.arch }})
    # The update signing key is a secret of this environment only, which takes only `v*` tags: a workflow pushed
    # on any other ref never gets it (§8).
    environment: release
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points to a commit outside main"
            exit 1
          fi

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm --filter @trackwall/ui build
      - run: pnpm --filter @trackwall/daemon build --target ${{ matrix.triple }}
      - run: bun apps/desktop/scripts/package-linux.ts ${{ matrix.arch }}
      # The smoke test runs the binary as the archive unpacks it, with the page next to it.
      - name: smoke test of the unpacked archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          unpacked="$RUNNER_TEMP/linux-archive"
          mkdir -p "$unpacked"
          tar -xzf "out/trackwall-${TAG#v}-linux-${{ matrix.arch }}.tar.gz" -C "$unpacked"
          bun packages/daemon/scripts/smoke.ts "$unpacked/trackwall/trackwall-daemon" --page
      # Only this step gets the key, as in the build job.
      - name: Sign the archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set, see docs/release.md"
            exit 1
          fi
          pnpm --filter @trackwall/desktop exec tauri signer sign --app-version "${TAG#v}" \
            "$GITHUB_WORKSPACE/out/trackwall-${TAG#v}-linux-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: trackwall-Linux-${{ matrix.arch }}
          path: |
            out/*.tar.gz
            out/*.sig
          if-no-files-found: error
          retention-days: 7

  # Packs the VS Code extension, checks the files and writes SHA256SUMS.txt and latest.json without write access: it
  # runs `pnpm install` for the scripts, and only the publish job below may change the repo.
  manifest:
    needs: [build, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: trackwall-*
          path: dist
          merge-multiple: true

      # The VS Code extension (ADR-221), for a download next to the app. Its version is the app's (versions.test.ts);
      # the next step refuses a .vsix not named after the tag.
      - name: VS Code extension
        run: |
          pnpm --filter @trackwall/vscode package
          unzip -l apps/vscode/out/*.vsix
          cp apps/vscode/out/*.vsix dist/

      - name: Checksums
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          win="trackwall-$version-windows-x64.zip"
          mac="trackwall-$version-macos-arm64.zip"
          mac_update="trackwall-$version-macos-arm64.app.tar.gz"
          linux_x64="trackwall-$version-linux-x64.tar.gz"
          linux_arm64="trackwall-$version-linux-arm64.tar.gz"
          vsix="trackwall-$version.vsix"
          expected=("$win" "$mac" "$mac_update" "$linux_x64" "$linux_arm64" "$vsix" "$win.sig" "$mac_update.sig" "$linux_x64.sig" "$linux_arm64.sig")
          for f in "${expected[@]}"; do
            [ -f "$f" ] || { echo "::error::Missing $f, found: $(ls)"; exit 1; }
          done
          if [ "$(ls | wc -l)" -ne ${#expected[@]} ]; then
            echo "::error::Expected only ${expected[*]}, found: $(ls)"
            exit 1
          fi
          # The Dev Container Feature (ADR-164) carries the SHA-256 of both Linux archives it installs.
          bun ../apps/desktop/scripts/package-feature.ts .
          feature="devcontainer-feature-trackwall.tgz"
          sha256sum "$win" "$mac" "$mac_update" "$linux_x64" "$linux_arm64" "$vsix" "$feature" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The manifest the app's updater reads from releases/latest/download/latest.json (ADR-53); the script refuses a
      # signature made with another key than the one in tauri.conf.json. A pre-release is never "latest" on GitHub,
      # so its manifest reaches only a check pointed at it.
      - name: Update manifest
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: bun apps/desktop/scripts/update-manifest.ts dist "$TAG" "$REPO"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: trackwall-manifest
          path: |
            dist/SHA256SUMS.txt
            dist/latest.json
            dist/devcontainer-feature-trackwall.tgz
            dist/*.vsix
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only the release note; the versions.test.ts test makes sure it exists for the tagged version.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: docs/release-notes
          persist-credentials: false

      # The packages and signatures of every build and the manifest job's files.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: trackwall-*
          path: dist
          merge-multiple: true

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Rerun after a failure: replace the files, do not create a second release.
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=()
            if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
            # The note from the repo goes before the list of PRs that GitHub generates.
            gh release create "$TAG" dist/* --verify-tag --generate-notes \
              --notes-file "docs/release-notes/$TAG.md" --title "Trackwall ${TAG#v}" "${prerelease[@]}"
          fi
