name: Nightly Copilot CLI

# The contract tests (ADR-67) on the newest stable Copilot CLI on npm instead of the pinned one, on Linux, Windows and
# macOS, every night. Copilot CLI ships almost every working day, so a version that changes a hook, a payload field or
# the approval dialog shows up here before anyone raises COPILOT_CLI_VERSION in packages/daemon/scripts/copilot-cli.ts.
# A failure opens an issue for that version (or comments on the open one), and a green run on the newest version closes
# the open ones. Each failed `contract` job log prints the Copilot CLI reference it saw, which the PR raising the
# version starts from (docs/development.md). Not part of `CI ok`: a new Copilot CLI must not turn every PR red.
on:
  schedule:
    # Once a night (UTC), outside the full hour when scheduled runs queue the longest.
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      copilot-cli:
        description: An exact Copilot CLI version (empty for the newest stable one on npm)
        required: false
        default: ""

# A manual run while the night's run is going waits for it, so both do not report on the same issue at once.
concurrency:
  group: nightly-copilot-cli
  cancel-in-progress: false

# No permissions by default; every job gets only what it needs.
permissions: {}

# The same versions as in mise.toml; apps/desktop/test/toolchain.test.ts guards this.
env:
  BUN_VERSION: "1.4.4"
  NODE_VERSION: "22"

jobs:
  # Once for all systems, so that a release published during the run does not test different versions side by side.
  version:
    name: newest Copilot CLI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      copilot-cli: ${{ steps.resolve.outputs.copilot-cli }}
    steps:
      - id: resolve
        env:
          WANTED: ${{ inputs.copilot-cli }}
        run: |
          version="${WANTED:-$(curl -fsS https://registry.npmjs.org/-/package/@github/copilot/dist-tags | jq -r .latest)}"
          # The version comes from the registry or a person and goes into an issue title, so only an exact version passes.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not an exact Copilot CLI version: $version"
            exit 1
          fi
          echo "Copilot CLI $version"
          echo "copilot-cli=$version" >> "$GITHUB_OUTPUT"

  # The same steps as the `contract` job of ci.yml, without the cache: a new version would not hit it anyway.
  contract:
    name: contract with Copilot CLI ${{ needs.version.outputs.copilot-cli }} (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm test:contract
        env:
          TRACKWALL_COPILOT_CLI: ${{ needs.version.outputs.copilot-cli }}

  # One open issue per failing version; a cancelled or skipped run reports nothing.
  report:
    name: report
    needs: [version, contract]
    if: always() && (needs.contract.result == 'success' || needs.contract.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.copilot-cli }}
      RESULT: ${{ needs.contract.result }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # A manual run of an exact version speaks only for that version, not for the newest one.
      NEWEST: ${{ inputs.copilot-cli == '' }}
    steps:
      - name: Open, update or close the issue
        run: |
          prefix="Contract tests fail on Copilot CLI"
          title="$prefix $VERSION"
          open=$(gh issue list --state open --limit 100 --search "\"$prefix\" in:title" --json number,title)
          if [ "$RESULT" = success ]; then
            filter='.[] | select(.title | startswith($prefix)) | .number'
            [ "$NEWEST" = true ] || filter='.[] | select(.title == $title) | .number'
            for number in $(jq -r --arg prefix "$prefix " --arg title "$title" "$filter" <<< "$open"); do
              gh issue close "$number" --comment "The contract tests pass on Copilot CLI $VERSION on all three systems: $RUN"
            done
            exit 0
          fi
          number=$(jq -r --arg title "$title" 'map(select(.title == $title))[0].number // empty' <<< "$open")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing: $RUN"
            exit 0
          fi
          gh issue create --title "$title" --body-file - <<EOF
          The nightly contract tests fail on Copilot CLI $VERSION: $RUN

          Trackwall is checked against the version pinned in \`packages/daemon/scripts/copilot-cli.ts\`, so a user who updates Copilot CLI may get sessions whose state the daemon misreads. The log of each failed \`contract\` job says what differs and prints the Copilot CLI reference it saw.

          To fix: raise \`COPILOT_CLI_VERSION\` to $VERSION in a PR, take the references again and change the daemon and the fake Copilot CLI to the new behaviour, as described in \`docs/development.md\` ("Contract tests with the real Copilot CLI"). This issue closes on the first night the contract tests pass on the newest Copilot CLI.
          EOF
