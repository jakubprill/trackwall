name: Błąd
description: Coś działa inaczej, niż powinno.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Nie wklejaj nazw firmowych repo, hostów ani wartości sekretów. Zanonimizuj logi.
  - type: textarea
    id: co
    attributes:
      label: Co się stało
      description: Co zostało zrobione, co się stało i czego należało się spodziewać.
    validations:
      required: true
  - type: textarea
    id: kroki
    attributes:
      label: Jak powtórzyć
      placeholder: |
        1. …
        2. …
  - type: dropdown
    id: system
    attributes:
      label: System
      multiple: true
      options:
        - Windows
        - macOS
    validations:
      required: true
  - type: input
    id: wersja-systemu
    attributes:
      label: Wersja systemu i architektura
      placeholder: Windows 11 23H2 x64 / macOS 15.4 arm64
  - type: input
    id: wersja
    attributes:
      label: Wersja Pitwall
      description: Z panelu daemona w UI (pole „Wersja”), z nazwy archiwum zip albo, przy uruchomieniu ze źródeł, hash commita.
    validations:
      required: true
  - type: textarea
    id: logi
    attributes:
      label: Logi
      description: Fragment logu po zanonimizowaniu. Log startu daemona jest w `~/.pitwall/logs/daemon-start.log` (na Windowsie `%USERPROFILE%\.pitwall\logs`).
      render: text
