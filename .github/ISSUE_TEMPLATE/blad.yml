name: Błąd
description: Coś działa inaczej, niż powinno.
body:
  - type: markdown
    attributes:
      value: Nie wklejaj nazw firmowych repo, hostów ani wartości sekretów. Zanonimizuj logi.
  - type: textarea
    id: co
    attributes:
      label: Co się stało
      description: Co zostało zrobione, co się stało i czego należało się spodziewać.
    validations:
      required: true
  - type: textarea
    id: kroki
    attributes:
      label: Jak powtórzyć
      placeholder: |
        1. …
        2. …
  - type: dropdown
    id: system
    attributes:
      label: System
      multiple: true
      options:
        - Windows
        - macOS
    validations:
      required: true
  - type: input
    id: wersja
    attributes:
      label: Wersja Pitwall
      description: Z nazwy zipa, z `/api/health` albo hash commita przy uruchomieniu ze źródeł.
    validations:
      required: true
  - type: textarea
    id: logi
    attributes:
      label: Logi
      description: Fragment logu daemona albo serwisu, po zanonimizowaniu.
      render: text
