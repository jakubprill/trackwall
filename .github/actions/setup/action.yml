# Shared job setup: pnpm (version from packageManager), Node, Bun and dependencies.
# One place for ci.yml and release.yml; actions pinned to a SHA as in the workflows.
name: Set up Node, pnpm and Bun
description: pnpm, Node and Bun at the versions from the workflow (the same as in mise.toml), plus pnpm install
inputs:
  node-version:
    description: Node version (NODE_VERSION from the workflow)
    required: true
  bun-version:
    description: Bun version (BUN_VERSION from the workflow)
    required: true
runs:
  using: composite
  steps:
    # GitHub does not enforce `required` in composite actions; without this an empty version would silently pick the latest.
    - name: Check versions
      shell: bash
      env:
        NODE: ${{ inputs.node-version }}
        BUN: ${{ inputs.bun-version }}
      run: |
        if [ -z "$NODE" ] || [ -z "$BUN" ]; then
          echo "::error::.github/actions/setup requires node-version and bun-version"
          exit 1
        fi
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
    - shell: bash
      run: pnpm install --frozen-lockfile
