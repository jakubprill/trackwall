# Wspólne przygotowanie joba: pnpm (wersja z packageManager), Node, Bun i zależności.
# Jedno miejsce dla ci.yml i release.yml; akcje przypięte do SHA jak w workflow.
name: Przygotowanie Node, pnpm i Bun
description: pnpm, Node i Bun w wersjach z workflow (te same co w mise.toml) oraz pnpm install
inputs:
  node-version:
    description: wersja Node (NODE_VERSION z workflow)
    required: true
  bun-version:
    description: wersja Bun (BUN_VERSION z workflow)
    required: true
runs:
  using: composite
  steps:
    # GitHub nie wymusza `required` w akcjach złożonych; bez tego pusta wersja oznaczałaby cichy wybór najnowszej.
    - name: Sprawdź wersje
      shell: bash
      env:
        NODE: ${{ inputs.node-version }}
        BUN: ${{ inputs.bun-version }}
      run: |
        if [ -z "$NODE" ] || [ -z "$BUN" ]; then
          echo "::error::.github/actions/setup wymaga node-version i bun-version"
          exit 1
        fi
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
    - shell: bash
      run: pnpm install --frozen-lockfile
