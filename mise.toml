# Wersje narzędzi dla samego projektu Pitwall (nie dla repo z workspace użytkownika).
[tools]
node = "22"
bun = "1.4.2"
pnpm = "10.28.0"
rust = "1.90"

# Taski (`mise tasks`, `mise run <nazwa>`): skróty do komend z README, które najpierw instalują zależności.
# Nazwy jak taski repo w workspace (CONTEXT.md: setup, dev, ...).
[tasks.setup]
description = "Zależności workspace z lockfile (pnpm install --frozen-lockfile)"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Daemon i Vite w trybie deweloperskim, UI na http://127.0.0.1:5173 (stan w .pitwall-dev/)"
depends = ["setup"]
run = "pnpm dev"

[tasks.portable]
description = "Portable build z oknem Tauri do out/ (Windows: wymaga Visual Studio Build Tools z C++)"
depends = ["setup"]
run = ["pnpm build:desktop", "pnpm portable"]
