[package]
name = "trackwall-desktop"
version = "0.2.0"
description = "Trackwall: okno, tray i nadzór daemona"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

[[bin]]
name = "trackwall"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

# tauri-plugin-deep-link 2.6.2 builds `rust-ini`'s `ParseOption` with a struct literal (Linux only), and 0.21.2 added
# fields to it, so a newer rust-ini breaks the Linux build. CI builds the shell only on Windows and macOS, so this pin
# keeps `cargo test` working on Linux; drop it once the plugin compiles with the latest rust-ini.
[target.'cfg(target_os = "linux")'.dependencies]
rust-ini = "=0.21.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry"] }
tauri-winrt-notification = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
window-vibrancy = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
