[package]
name = "trackwall-desktop"
version = "0.5.13"
description = "Trackwall: window, tray and daemon supervision"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

[[bin]]
name = "trackwall"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# Writing text to the clipboard (`copy_text`); without the default `image-data`, which would bring in image decoders.
arboard = { version = "3", default-features = false }
# Unpacking the portable Windows update (ADR-53); built on every system so that its tests run everywhere.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# zip asks flate2 for no backend; without this one the build depends on another crate happening to enable it.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Cancelling the update download (`select!` against a `Notify`, ADR-53); already in the build through Tauri.
tokio = { version = "1", features = ["sync", "macros"] }
# The start entry at sign-in (ADR-65), without tauri-plugin-autostart (see autostart.rs).
auto-launch = "0.6"

# tauri-plugin-deep-link 2.6.2 builds `rust-ini`'s `ParseOption` with a struct literal (Linux only), and 0.21.2 added
# fields to it, so a newer rust-ini breaks the Linux build. CI builds the shell only on Windows and macOS, so this pin
# keeps `cargo test` working on Linux; drop it once the plugin compiles with the latest rust-ini.
[target.'cfg(target_os = "linux")'.dependencies]
rust-ini = "=0.21.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry"] }
tauri-winrt-notification = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
window-vibrancy = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
