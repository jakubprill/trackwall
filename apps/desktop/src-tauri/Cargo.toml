[package]
name = "pitwall-desktop"
version = "0.1.0"
description = "Pitwall: okno, tray i nadzór daemona"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

[[bin]]
name = "pitwall"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
