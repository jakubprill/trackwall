[package]
name = "trackwall-desktop"
version = "0.2.0"
description = "Trackwall: okno, tray i nadzór daemona"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

[[bin]]
name = "trackwall"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Unpacking the portable Windows update (ADR-53); built on every system so that its tests run everywhere.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
window-vibrancy = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
