<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Trackwall</title>
  <!-- Tray mark: the silhouette of the "Node" icon in one colour. On macOS it is a template the system recolours for the menu bar. -->
  <g stroke="#000" stroke-width="2.5" stroke-linecap="round">
    <line x1="12.5" y1="12.5" x2="8.5" y2="8.5"/>
    <line x1="19.5" y1="12.5" x2="23.5" y2="8.5"/>
    <line x1="12.5" y1="19.5" x2="8.5" y2="23.5"/>
    <line x1="19.5" y1="19.5" x2="23.5" y2="23.5"/>
  </g>
  <circle cx="16" cy="16" r="4.5" fill="none" stroke="#000" stroke-width="3"/>
  <circle cx="6.5" cy="6.5" r="3.5" fill="#000"/>
  <circle cx="25.5" cy="6.5" r="3.5" fill="#000"/>
  <circle cx="6.5" cy="25.5" r="3.5" fill="#000"/>
  <circle cx="25.5" cy="25.5" r="3.5" fill="#000"/>
</svg>
