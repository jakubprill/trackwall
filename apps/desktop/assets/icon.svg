<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Trackwall</title>
  <!-- Ikona aplikacji „Węzeł”: Trackwall w środku, repo i agenci wokół, jeden aktywny. Kafel w siatce ikon macOS (412 z 512). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a222a"/>
      <stop offset="1" stop-color="#07090b"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="50" y="50" width="412" height="412" rx="92" fill="url(#tile)"/>
  <rect x="51.5" y="51.5" width="409" height="409" rx="90.5" fill="none" stroke="#56d4ec" stroke-opacity="0.22" stroke-width="3"/>
  <g stroke="#7f93a3" stroke-width="16" stroke-linecap="round">
    <line x1="216" y1="216" x2="160" y2="160"/>
    <line x1="296" y1="216" x2="352" y2="160"/>
    <line x1="216" y1="296" x2="160" y2="352"/>
    <line x1="296" y1="296" x2="352" y2="352"/>
  </g>
  <circle cx="150" cy="150" r="30" fill="#e8f1f5"/>
  <circle cx="150" cy="362" r="30" fill="#e8f1f5"/>
  <circle cx="362" cy="362" r="30" fill="#e8f1f5"/>
  <circle cx="362" cy="150" r="30" fill="#56d4ec" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="52" fill="#0d1216" stroke="#56d4ec" stroke-width="28" filter="url(#glow)"/>
</svg>
